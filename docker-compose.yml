services:
  # PHP-FPM application container
  app:
    build:
      context: .
      target: app
    image: qrmenu-app
    # Stable, unique DNS name so the web container's nginx (fastcgi_pass
    # xorder-app:9000) resolves it unambiguously — matches the co-host deploy.
    container_name: xorder-app
    env_file: apps/api/.env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploaded images (public disk) and logs across rebuilds.
      - storage-data:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Laravel scheduler — daily subscription expiry + warnings.
  scheduler:
    image: qrmenu-app
    env_file: apps/api/.env.docker
    environment:
      RUN_MIGRATIONS: "false"
      SEED_ON_START: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - storage-data:/var/www/html/storage
    restart: unless-stopped

  # Nginx — serves static assets and proxies PHP requests to `app`
  web:
    build:
      context: .
      target: web
    image: qrmenu-web
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      # Read-only access to uploaded images so nginx can serve /storage/*.
      - storage-data:/var/www/html/storage:ro
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qrmenu}
      POSTGRES_USER: ${DB_USERNAME:-qrmenu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Local-only publish so DBeaver/psql on the host can reach the container.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qrmenu} -d ${DB_DATABASE:-qrmenu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  storage-data:
  pgdata:
