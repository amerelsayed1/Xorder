# The xorder-pos workspace (Dart pub workspace). No code lives here: the
# packages do. One lockfile, this folder's pubspec.lock, resolves them all.
#
#   packages/xorder_pos        the shared till: money rules, screens, the branch
#                              database, the wiring (docs/features/pos-split-apps)
#   apps/xorder_pos_offline    "XOrder POS - Offline": entry point + platforms;
#                              from stage 3 also the back office
#   apps/xorder_pos_cloud      "XOrder POS - Cloud": entry point + platforms;
#                              from stage 3 also the cloud sync code
#
# Run `flutter pub get` in any member once; every member then shares the
# resolution.
name: xorder_pos_workspace
publish_to: 'none'

environment:
  sdk: ^3.13.0

workspace:
  - packages/xorder_pos
  - apps/xorder_pos_offline
  - apps/xorder_pos_cloud
