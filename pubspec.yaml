# The xorder-pos workspace (Dart pub workspace). No code lives here: the
# packages do. One lockfile, this folder's pubspec.lock, resolves them all.
#
#   packages/xorder_pos   the shared till: money rules, screens, the branch
#                         database, the wiring (docs/features/pos-split-apps)
#
# Run `flutter pub get` here once; every member then shares the resolution.
name: xorder_pos_workspace
publish_to: 'none'

environment:
  sdk: ^3.13.0

workspace:
  - packages/xorder_pos
