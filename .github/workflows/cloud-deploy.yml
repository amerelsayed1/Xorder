name: Cloud - Deploy to production

# Manual only: run it from the Actions tab.
# Monorepo layout: the cloud platform lives in apps/xorder-cloud, so every
# build step below sets `working-directory` to it.
on:
  workflow_dispatch:

# Least privilege: the jobs only read the repository. Doppler and SSH carry the rest.
permissions:
  contents: read

# Never let two production deploys overlap.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Verify the monorepo builds before touching production ───────────────
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Front-ends (apps/web, apps/landing, apps/menu) + api Vite build.
      # Version comes from package.json "packageManager" (pnpm@9.12.0).
      # Don't also set `version:` here — action-setup@v4 errors on both.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/xorder-cloud/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/xorder-cloud/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/xorder-cloud
      - run: pnpm build
        working-directory: apps/xorder-cloud

      # Laravel API (apps/xorder-cloud/apps/api).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, mbstring, bcmath, zip, intl, gd
      - name: Composer install (apps/api)
        working-directory: apps/xorder-cloud/apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP (apps/api)
        working-directory: apps/xorder-cloud/apps/api
        run: |
          find app routes config database -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Code style (pint)
        working-directory: apps/xorder-cloud/apps/api
        run: ./vendor/bin/pint --test

      # Full feature suite (SQLite in-memory) — a red test blocks the deploy.
      # Covers auth, tenant isolation, provisioning, public menu + SEO shell,
      # subscription gating, leads.
      - name: Feature tests (apps/api)
        working-directory: apps/xorder-cloud/apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan test tests/Feature

  # ── 2. Deploy over SSH (runs deploy.sh on the VPS) ─────────────────────────
  # Secrets come from Doppler (project xorder, config prd), not from GitHub
  # Actions secrets. The only GitHub secret is DOPPLER_TOKEN: a read-only Doppler
  # service token scoped to xorder/prd. SSH_HOST, SSH_USER, SSH_KEY and
  # SSH_KNOWN_HOSTS (and the optional SSH_PORT) are read from Doppler at run time.
  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    # Optional: gate on a GitHub "production" environment for required reviewers.
    environment: production
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Deploy via SSH
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Compose file to use on the server (defaults to the co-host layout).
          COMPOSE_FILE: ${{ vars.XORDER_COMPOSE_FILE }}
          # Directory on the VPS that holds deploy.sh (defaults to /opt/xorder).
          # Unchanged on purpose: while the VPS clone is still the old
          # Xorder-Menu repo this keeps working as before. Once the VPS clones
          # the monorepo, set XORDER_DEPLOY_PATH to <clone>/apps/xorder-cloud.
          DEPLOY_PATH: ${{ vars.XORDER_DEPLOY_PATH }}
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN is not configured. Add a read-only Doppler service token for xorder/prd as the repo secret DOPPLER_TOKEN."
            exit 1
          fi
          # The script runs under `doppler run`, so SSH_* are in its environment.
          # ssh uses -n so it never reads the script from stdin.
          doppler run --project xorder --config prd -- bash -euo pipefail -s <<'SCRIPT'
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::SSH_HOST, SSH_USER or SSH_KEY is empty in Doppler xorder/prd."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          # Pinned host keys (Doppler SSH_KNOWN_HOSTS, ssh known_hosts format).
          # Never scan the network at run time: that would trust whoever answers.
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::SSH_KNOWN_HOSTS is empty in Doppler xorder/prd. Add the server's host keys (ssh-keygen -F <host>)."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          REMOTE_PATH="${DEPLOY_PATH:-/opt/xorder}"
          REMOTE_COMPOSE="${COMPOSE_FILE:-$REMOTE_PATH/docker-compose.cohost.yml}"
          ssh -n -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_PATH' && export XORDER_COMPOSE_FILE='$REMOTE_COMPOSE' && ./deploy.sh --ci"
          SCRIPT
