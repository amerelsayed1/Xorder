name: Windows installer

# Readiness item 10, run by a machine rather than remembered: build the
# installer, install it on a clean Windows runner, check the app, the database
# and its accounts, then run the SAME installer again as an upgrade and check
# nothing was lost. On a tag, the installer is attached to a release.
#
# A tag is a restaurant release: it must be tested, signed, built with the
# release licence key, and use an integrity-pinned PostgreSQL archive. Manual
# runs may exercise the installer unsigned, but can never publish a release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'
  # EDB's binaries-only build. This repository variable is mandatory; a blank
  # value fails before the archive is expanded.
  PG_VERSION: '16.11-1'
  PG_SHA256: ${{ vars.XORDER_PG_SHA256 }}
  XORDER_LICENSE_PUBLIC_KEY_B64: ${{ vars.XORDER_LICENSE_PUBLIC_KEY_B64 }}
  XORDER_LICENSE_KEY_ID: ${{ vars.XORDER_LICENSE_KEY_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xorder_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xorder_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Analyse and test, including PostgreSQL suites
        env:
          POS_PG_HOST: 127.0.0.1
          POS_PG_PORT: '5432'
          POS_PG_USER: postgres
          POS_PG_PASSWORD: postgres
        run: |
          flutter pub get
          flutter analyze
          flutter test

  installer:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version from pubspec
        id: version
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: The tag is the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ("v${{ steps.version.outputs.value }}" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pubspec ${{ steps.version.outputs.value }}"
          }

      - name: Build the app
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XORDER_LICENSE_PUBLIC_KEY_B64) -or [string]::IsNullOrWhiteSpace($env:XORDER_LICENSE_KEY_ID)) {
            throw 'XORDER_LICENSE_PUBLIC_KEY_B64 and XORDER_LICENSE_KEY_ID repository variables are required for a release build.'
          }
          flutter pub get
          flutter build windows --release "--dart-define=XORDER_LICENSE_PUBLIC_KEY_B64=$env:XORDER_LICENSE_PUBLIC_KEY_B64" "--dart-define=XORDER_LICENSE_KEY_ID=$env:XORDER_LICENSE_KEY_ID"

      - name: Build pos_migrate.exe
        run: |
          New-Item -ItemType Directory -Force build/installer/tools | Out-Null
          dart compile exe bin/pos_migrate.dart -o build/installer/tools/pos_migrate.exe

      - name: PostgreSQL binaries
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PG_SHA256)) { throw 'XORDER_PG_SHA256 repository variable is required.' }
          $zip = Join-Path $env:RUNNER_TEMP 'pgsql.zip'
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-windows-x64-binaries.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "PostgreSQL $env:PG_VERSION sha256 $hash"
          if ($hash -ne $env:PG_SHA256) { throw "PostgreSQL download does not match PG_SHA256" }
          Expand-Archive $zip -DestinationPath build/installer
          # The server, the client tools and their libraries. Not pgAdmin, the
          # docs or debug symbols — a third of the size and none of the use.
          'pgAdmin 4', 'StackBuilder', 'doc', 'symbols', 'include' | ForEach-Object {
            Remove-Item -Recurse -Force (Join-Path build/installer/pgsql $_) -ErrorAction SilentlyContinue
          }

      - name: Visual C++ runtime
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/installer/tools/vc_redist.x64.exe

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $args = @(
            "/DAppVersion=${{ steps.version.outputs.value }}",
            '/DAppDir=..\build\windows\x64\runner\Release',
            '/DPgDir=..\build\installer\pgsql',
            '/DToolsDir=..\build\installer\tools'
          )
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
            $sign = "`"$signtool`" sign /f `"$pfx`" /p `"$env:WINDOWS_CERT_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256"
            # The app and the tool first, so what the installer carries is signed too.
            & cmd /c "$sign build\windows\x64\runner\Release\xorder_pos.exe build\installer\tools\pos_migrate.exe"
            if ($LASTEXITCODE -ne 0) { throw 'signing the app failed' }
            $args += @('/DSIGN', "/Ssigntool=$sign `$f")
          } else {
            if ("${{ github.ref }}" -like 'refs/tags/*') {
              throw 'A tagged release requires WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD.'
            }
            Write-Host '::warning::Manual verification build is unsigned and must not be distributed.'
          }
          & $iscc @args installer\xorder-pos.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Install, check, upgrade, check again
        run: |
          $setup = (Get-ChildItem dist\XOrder-POS-Setup-*.exe | Select-Object -First 1).FullName
          $root = Join-Path $env:ProgramData 'XOrder POS'
          $app = Join-Path $env:ProgramFiles 'XOrder POS'

          function Install([string] $name) {
            $p = Start-Process $setup -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TYPE=server',
              "/LOG=$env:RUNNER_TEMP\setup-$name.log")
            Get-Content (Join-Path $root 'logs\provision.log') -Tail 25
            if ($p.ExitCode -ne 0) { throw "setup ($name) exited with $($p.ExitCode)" }
          }

          function Check([string] $when) {
            if ((Get-Service XOrderPOS-PostgreSQL).Status -ne 'Running') { throw "$when: the database service is not running" }
            if (-not (Test-Path (Join-Path $app 'xorder_pos.exe'))) { throw "$when: the app is not installed" }
            $script:creds = Get-Content (Join-Path $root 'install-credentials.json') -Raw | ConvertFrom-Json
            $env:POS_PG_PASSWORD = $creds.admin.password
            $status = & (Join-Path $app 'tools\pos_migrate.exe') --host 127.0.0.1 --port $creds.port `
              --database xorder_pos --user pos_admin --no-verify-tls --status
            if ($status -match 'PENDING') { throw "$when: migrations still pending`n$status" }
          }

          function Sql([string] $user, [string] $password, [string] $query) {
            $env:PGPASSWORD = $password
            $out = & (Join-Path $app 'pgsql\bin\psql.exe') -h 127.0.0.1 -p $creds.port -U $user -d xorder_pos -tAc $query
            if ($LASTEXITCODE -ne 0) { throw "psql as $user failed: $query" }
            return "$out".Trim()
          }

          Install 'first'
          Check 'after install'
          if ((Sql 'pos_admin' $creds.admin.password "SELECT tableowner FROM pg_tables WHERE tablename = 'pos_orders'") -ne 'pos_admin') {
            throw 'the tables are not pos_admin''s, so a restore could not replace them'
          }
          Sql 'pos_admin' $creds.admin.password "INSERT INTO pos_restaurants (slug, name) VALUES ('ci-marker', 'Survives the upgrade')" | Out-Null
          Sql 'pos_backup' $creds.backup.password 'SELECT count(*) FROM pos_orders' | Out-Null

          Install 'upgrade'
          Check 'after upgrade'
          if ((Sql 'pos_till' $creds.till.password "SELECT count(*) FROM pos_restaurants WHERE slug = 'ci-marker'") -ne '1') {
            throw 'the upgrade lost data'
          }
          Write-Host 'Installed, upgraded in place, nothing lost.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorder-pos-windows-${{ steps.version.outputs.value }}
          path: |
            dist/XOrder-POS-Setup-*.exe
            ${{ runner.temp }}/setup-*.log

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/XOrder-POS-Setup-*.exe
