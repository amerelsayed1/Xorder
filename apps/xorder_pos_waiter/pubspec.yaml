# "XOrder Waiter" (waiter-app, WA1): table orders on a phone or tablet, paired
# with the till that holds the tables. It depends on the link package and
# Flutter only — never on packages/shared_module — so a handheld does not ship
# PostgreSQL, the encrypted SQLite engine or the desktop screens. Everything it
# shows was priced by the till (FEATURE BR-2).
name: xorder_pos_waiter
description: "XOrder Waiter: table orders on a handheld, priced by the till."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Where the pairing (till address + device token) is kept on the device.
  path_provider: ^2.1.6
  xorder_waiter_link: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The till's faces, shipped again here (fonts are assets, not till code —
  # D-WA4 holds): IBM Plex Sans Arabic for every word in either language,
  # IBM Plex Mono for every number. Same files as packages/shared_module.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
