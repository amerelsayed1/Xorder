# Shared Laravel locations — included by every server block. Assumes the block
# sets `root /var/www/html/public;` so PHP resolves correctly.

location ^~ /api/      { try_files $uri /index.php?$query_string; }
location ^~ /sanctum/  { try_files $uri /index.php?$query_string; }
location ^~ /r/        { try_files $uri /index.php?$query_string; }
location = /up         { try_files $uri /index.php?$query_string; }
location = /sitemap.xml { try_files $uri /index.php?$query_string; }

# Uploaded images (shared storage volume, mounted read-only).
# Filenames are ULIDs minted per upload (covers/01KYN74A0….webp), so a given URL
# never changes content — replacing an image writes a new name. 7d meant every
# diner re-downloaded a ~120 KB cover each week for no reason; immutable is both
# correct and what the naming scheme was for.
# `^~` is load-bearing, not style: a plain prefix location loses to the
# `\.php$` regex below, so /storage/x.php would be handed to PHP-FPM and
# executed through the public/storage symlink. Uploads are re-encoded to
# ULID-named .webp so nothing can currently land there, but the file tree is
# user-writable in spirit — the prefix must win before naming is the only guard.
location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";

    # User-supplied bytes: never let a browser sniff them into something
    # active, never let them frame or script anything if one ever does.
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header X-Frame-Options DENY always;

    # Defense in depth behind the `^~`: even if this block were reordered or
    # copied into a server block without it, scripts stay inert.
    location ~* \.(php|phtml|phar|phps|pl|py|cgi|sh|lua|rb|jsp|asp|aspx|htaccess)$ {
        deny all;
    }

    try_files $uri =404;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    # Use the unique container name, NOT the bare `app` service alias: in the
    # co-host deploy the web container also joins Operix's shared network where
    # `app` collides with operix-app, so PHP requests get misrouted to Operix's
    # Laravel (every xorder API route then 404s). `xorder-app` is unambiguous.
    fastcgi_pass xorder-app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
}

location ~ /\.(?!well-known).* {
    deny all;
}
