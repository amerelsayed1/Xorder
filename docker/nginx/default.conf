# Compress text assets — the admin SPA bundle is ~400KB uncompressed, so
# serving it raw is the main reason the dashboard is slow to open.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml application/wasm;

# On a restaurant subdomain the bare root ("/") sends visitors to the public
# menu; the super-admin host (admin.localhost) keeps the SPA at its root.
# $sub is the subdomain captured by the regex server_name below.
map $sub $root_to_menu {
    default 1;
    admin   0;
}

# ===========================================================================
# Main domain (localhost / 127.0.0.1):  landing site + Laravel API/menu.
# ===========================================================================
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;          # Laravel public (PHP)
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;              # keep host:port on any internal redirect

    include /etc/nginx/snippets/laravel.conf;

    # Hashed landing assets — safe to cache forever.
    location ^~ /assets/ {
        root /var/www/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Landing (apps/landing) at the root.
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ===========================================================================
# Admin subdomains (admin.localhost + every {slug}.localhost):
#   /       -> the SPA (super admin or restaurant dashboard, decided client-side)
#   /api, /r, /storage -> Laravel
#   /menu   -> public guest menu SPA (QR target on restaurant subdomains)
# ===========================================================================
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.localhost$;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;              # keep host:port on any internal redirect

    include /etc/nginx/snippets/laravel.conf;

    # Public guest menu SPA (apps/menu), base /menu/ → files live at menu/.
    # Laravel /api routes are handled by laravel.conf and take precedence.
    location = /menu {
        return 301 /menu/$is_args$args;
    }
    location ^~ /menu/assets/ {
        alias /var/www/menu/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /menu/ {
        alias /var/www/menu/;
        try_files $uri @menu_shell;
    }

    # SPA shell via Laravel: MenuShellService injects per-restaurant SEO/OG/
    # JSON-LD tags — WhatsApp link previews don't execute JS, so the tags
    # must be in the server response.
    location @menu_shell {
        include fastcgi_params;
        fastcgi_pass xorder-app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
    }

    # Hashed admin-SPA assets — content-hashed filenames, cache forever.
    location ^~ /assets/ {
        root /var/www/spa;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bare root: restaurant subdomains go to the public menu; the admin host
    # keeps the SPA. Only the exact "/" is affected — deeper SPA routes
    # (/login, /orders, ...) still fall through to the catch-all below.
    location = / {
        if ($root_to_menu) { return 301 /menu/; }
        root /var/www/spa;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Admin SPA (apps/web), built with base / → files live at spa/.
    location / {
        root /var/www/spa;
        try_files $uri @spa_shell;
    }

    # The SPA shell must always revalidate so a new deploy's hashed bundle is
    # picked up without a manual hard-refresh. Hashed /assets/ stay immutable.
    location @spa_shell {
        root /var/www/spa;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
