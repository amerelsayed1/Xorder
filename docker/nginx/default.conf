# ===========================================================================
# Main domain (localhost / 127.0.0.1):  landing site + Laravel API/menu.
# ===========================================================================
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;          # Laravel public (PHP + /build)
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;              # keep host:port on any internal redirect

    include /etc/nginx/snippets/laravel.conf;

    # Landing (apps/landing) at the root.
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ===========================================================================
# Admin subdomains (admin.localhost + every {slug}.localhost):
#   /       -> the SPA (super admin or restaurant dashboard, decided client-side)
#   /api, /r, /storage -> Laravel
#   /menu   -> public guest menu SPA (QR target on restaurant subdomains)
# ===========================================================================
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.localhost$;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;              # keep host:port on any internal redirect

    include /etc/nginx/snippets/laravel.conf;

    # Public guest menu SPA (apps/menu), base /menu/ → files live at menu/menu/.
    # Matched before the root SPA below because of its more-specific prefix.
    location = /menu {
        root /var/www/menu;
        try_files /menu/index.html =404;
    }
    location ^~ /menu/ {
        root /var/www/menu;
        try_files $uri /menu/index.html;
    }

    # Admin SPA (apps/web), built with base / → files live at spa/.
    # Client-side routing falls back to index.html. Laravel locations
    # (/api, /r, /storage, … from laravel.conf) are more specific and win.
    location / {
        root /var/www/spa;
        try_files $uri /index.html;
    }
}
