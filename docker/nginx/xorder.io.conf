# ===========================================================================
# OPERIX-SIDE vhost — copy this into Operix's nginx conf.d/ (additive only).
# It adds xorder.io + *.xorder.io and proxies them to the xorder-web container.
# It does NOT modify operixhq.com or rakeezasolutions.com.
#
#   1. Issue a WILDCARD cert first (HTTP-01 cannot do wildcards):
#        certbot certonly --manual --preferred-challenges dns \
#          -d xorder.io -d '*.xorder.io'
#      (add the printed _acme-challenge TXT record(s) at Namecheap)
#   2. Adjust the ssl_certificate paths below to match `ls /etc/letsencrypt/live/`.
#   3. Confirm `xorder-web` is on the same Docker network as this nginx
#      (OPERIX_PROXY_NETWORK), then:  nginx -t && nginx -s reload
# ===========================================================================

# --- HTTP: redirect to HTTPS (and allow ACME webroot if you ever use HTTP-01) ---
server {
    listen 80;
    listen [::]:80;
    server_name xorder.io www.xorder.io *.xorder.io;

    # Optional ACME webroot (only relevant for non-wildcard HTTP-01 renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: terminate TLS, proxy to the xorder internal nginx ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xorder.io www.xorder.io *.xorder.io;

    # Wildcard cert covering xorder.io AND *.xorder.io.
    ssl_certificate     /etc/letsencrypt/live/xorder.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xorder.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Match the app's upload limit.
    client_max_body_size 8m;

    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # `xorder-web` resolves over the shared Operix proxy network.
        proxy_pass http://xorder-web:80;
        proxy_http_version 1.1;

        # Preserve the original host so the internal nginx can tell apex from
        # {slug}.xorder.io, and so Laravel/Sanctum see the right domain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;   # TLS terminates here
        proxy_set_header X-Forwarded-Port  443;

        proxy_read_timeout 60s;
    }
}
