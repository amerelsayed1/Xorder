# Shared Laravel locations — included by every server block. Assumes the block
# sets `root /var/www/html/public;` so PHP resolves correctly.

location ^~ /api/      { try_files $uri /index.php?$query_string; }
location ^~ /sanctum/  { try_files $uri /index.php?$query_string; }
location ^~ /r/        { try_files $uri /index.php?$query_string; }
location = /up         { try_files $uri /index.php?$query_string; }
location = /sitemap.xml { try_files $uri /index.php?$query_string; }

# Uploaded images (shared storage volume, mounted read-only).
location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 7d;
    try_files $uri =404;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    # Use the unique container name, NOT the bare `app` service alias: in the
    # co-host deploy the web container also joins Operix's shared network where
    # `app` collides with operix-app, so PHP requests get misrouted to Operix's
    # Laravel (every xorder API route then 404s). `xorder-app` is unambiguous.
    fastcgi_pass xorder-app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
}

location ~ /\.(?!well-known).* {
    deny all;
}
