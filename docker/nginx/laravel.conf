# Shared Laravel locations — included by every server block. Assumes the block
# sets `root /var/www/html/public;` so PHP + /build resolve correctly.

location ^~ /api/      { try_files $uri /index.php?$query_string; }
location ^~ /sanctum/  { try_files $uri /index.php?$query_string; }
location ^~ /r/        { try_files $uri /index.php?$query_string; }
location = /up         { try_files $uri /index.php?$query_string; }

# Hashed public-menu CSS build (served from Laravel public).
location ^~ /build/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Uploaded images (shared storage volume, mounted read-only).
location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 7d;
    try_files $uri =404;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
}

location ~ /\.(?!well-known).* {
    deny all;
}
