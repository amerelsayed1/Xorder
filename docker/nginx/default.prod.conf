# ===========================================================================
# PRODUCTION internal nginx (the `web` container) for co-hosting on the Operix
# VPS. Identical routing to docker/nginx/default.conf, but server_name targets
# the real domain instead of localhost. TLS is terminated by Operix's OUTER
# nginx, which proxies plain HTTP here preserving the Host header — so this
# block listens on :80 and trusts the forwarded scheme.
#
#   apex  xorder.io / www.xorder.io  -> landing + Laravel API/menu/storage
#   sub   {anything}.xorder.io       -> admin SPA + guest menu SPA + Laravel
# ===========================================================================

# ---------------------------------------------------------------------------
# Apex (xorder.io, www.xorder.io): landing site + Laravel API / public menu.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name xorder.io www.xorder.io;
    root /var/www/html/public;          # Laravel public (PHP + /build)
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;              # keep host on any internal redirect

    include /etc/nginx/snippets/laravel.conf;

    # Landing (apps/landing) at the root.
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Admin + restaurant subdomains ({slug}.xorder.io, admin.xorder.io):
#   /       -> the SPA (super admin or restaurant dashboard, decided client-side)
#   /api, /r, /storage, /up -> Laravel  (from laravel.conf)
#   /menu   -> public guest menu SPA (QR target on restaurant subdomains)
# www is handled by the apex block above (exact server_name wins over regex).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.xorder\.io$;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;
    absolute_redirect off;

    include /etc/nginx/snippets/laravel.conf;

    # Public guest menu SPA (apps/menu), base /menu/ -> files live at menu/menu/.
    location = /menu {
        root /var/www/menu;
        try_files /menu/index.html =404;
    }
    location ^~ /menu/ {
        root /var/www/menu;
        try_files $uri /menu/index.html;
    }

    # Admin SPA (apps/web), built with base / -> files live at spa/.
    # Laravel locations (/api, /r, /storage, /up from laravel.conf) are more
    # specific and win over this catch-all.
    location / {
        root /var/www/spa;
        try_files $uri /index.html;
    }
}
